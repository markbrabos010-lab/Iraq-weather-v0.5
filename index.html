<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طقس العراق الاحترافي</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1021">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #090d1a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية متفاعلة مع غيوم وشمس متحركة */
    .sky-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 80% 20%, rgba(30, 58, 138, 0.35) 0%, rgba(9, 13, 26, 1) 80%);
    }

    /* حركة الغيوم السحابية */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      animation: moveClouds 35s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }
    .cloud1 { width: 200px; height: 60px; top: 10%; left: -200px; }
    .cloud1::before { width: 90px; height: 90px; top: -40px; left: 30px; }
    .cloud1::after { width: 70px; height: 70px; top: -30px; left: 90px; }

    .cloud2 { width: 300px; height: 80px; top: 40%; left: -300px; animation-duration: 50s; animation-delay: 5s; }
    .cloud2::before { width: 120px; height: 120px; top: -50px; left: 40px; }

    @keyframes moveClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }

    /* توهج الشمس/القمر */
    .sun-glow {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .container {
      width: 100%;
      max-width: 920px;
      z-index: 1;
    }

    /* قائمة خيارات المنطقة يمين الأعلى بشكل فخم */
    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 25px;
    }

    .select-wrapper {
      position: relative;
      background: rgba(23, 32, 56, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    select {
      background: transparent;
      color: #f8fafc;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      padding-left: 10px;
    }

    /* قسم درجات الحرارة الرئيسي */
    .main-weather {
      text-align: center;
      margin: 10px 0 30px 0;
    }

    .city-title {
      font-size: 2.4rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .current-temp {
      font-size: 6rem;
      font-weight: 200;
      color: #ffffff;
      line-height: 1;
      margin: 12px 0;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .sub-info {
      font-size: 1.05rem;
      color: #94a3b8;
    }

    .condition-text {
      font-size: 1.4rem;
      color: #cbd5e1;
      margin-top: 6px;
      font-weight: 500;
    }

    .card {
      background: rgba(23, 32, 56, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* الطقس كل ساعة */
    .hourly-container {
      display: flex;
      overflow-x: auto;
      gap: 20px;
      padding-bottom: 8px;
    }

    .hourly-container::-webkit-scrollbar { height: 4px; }
    .hourly-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .hourly-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 65px;
    }

    .hourly-item .time { color: #94a3b8; font-size: 0.8rem; margin-bottom: 6px; white-space: nowrap; }
    .hourly-item .icon { font-size: 1.6rem; margin-bottom: 6px; }
    .hourly-item .temp { font-weight: 600; color: #f8fafc; font-size: 0.95rem; }

    /* الأيام القادمة بالترتيب الصحيح */
    .daily-header-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 10px;
    }

    .daily-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .daily-col .day-name { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
    .daily-col .day-icon { font-size: 1.4rem; margin: 2px 0; }
    .daily-col .day-temp { font-size: 0.85rem; font-weight: bold; color: #f8fafc; }

    .chart-container {
      height: 150px;
      position: relative;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff;
      margin: 6px 0;
    }

    .metric-desc {
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- الغيوم والشمس التفاعلية -->
  <div class="sky-bg">
    <div class="sun-glow" id="sunGlow"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
  </div>

  <div class="container">
    <!-- قائمة الاختيار يمين الأعلى -->
    <div class="top-bar">
      <div class="select-wrapper">
        <select id="citySelect" onchange="fetchWeatherData()">
          <optgroup label="العاصمة والمناطق">
            <option value="33.3676,44.3419">الكاظمية 🕌</option>
            <option value="33.3152,44.3661">بغداد (المركز) 🏛️</option>
          </optgroup>
          <optgroup label="المحافظات العراقية">
            <option value="30.5081,47.7835">البصرة 🌴</option>
            <option value="36.1911,44.0091">أربيل 🏰</option>
            <option value="36.3400,43.1300">الموصل 🌉</option>
            <option value="35.4681,44.3922">كركوك 🛢️</option>
            <option value="35.5570,45.4329">السليمانية 🏔️</option>
            <option value="31.9958,44.3148">النجف الأشرف 🕌</option>
            <option value="32.6160,44.0249">كربلاء المقدسة 🕌</option>
            <option value="32.4637,44.4209">الحلة (بابل) 🦁</option>
            <option value="31.0572,46.2573">الناصرية 🌾</option>
            <option value="31.8360,47.1450">العمارة 🌊</option>
            <option value="32.5080,45.8330">الكوت 🌾</option>
            <option value="31.9920,44.9250">الديوانية 🏛️</option>
            <option value="33.4260,43.3030">الرمادي 🏜️</option>
            <option value="33.7540,44.6440">بعقوبة 🍊</option>
            <option value="34.1980,43.8850">سامراء 🕌</option>
            <option value="36.8670,42.9880">دهوك ⛰️</option>
            <option value="31.3170,45.2810">السماوة 🏜️</option>
          </optgroup>
        </select>
      </div>
    </div>

    <!-- الطقس الحالي -->
    <div class="main-weather">
      <div class="city-title" id="cityName">Kadhimiya</div>
      <div class="current-temp" id="currentTemp">--°</div>
      <div class="sub-info">العليا: <span id="maxTemp">--</span>° | الدنيا: <span id="minTemp">--</span>°</div>
      <div class="condition-text" id="conditionText">مشمس ☀️</div>
    </div>

    <!-- الطقس كل ساعة -->
    <div class="card">
      <div class="card-title">🕒 الطقس كل ساعة</div>
      <div class="hourly-container" id="hourlyContainer"></div>
    </div>

    <!-- توقع الأيام مرتبة زمنياً بشكل صحيح -->
    <div class="card">
      <div class="card-title">📅 توقع الطقس (الأيام القادمة)</div>
      <div class="daily-header-grid" id="dailyHeaderGrid"></div>
      <div class="chart-container">
        <canvas id="tempChart"></canvas>
      </div>
    </div>

    <!-- التفاصيل الفنية وتوقعات الأمطار -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">🌧️ توقع المطر القادم</div>
        <div class="metric-value" id="rainProb">0%</div>
        <div class="metric-desc" id="rainDesc">لا توجد فرصة هطول أمطار حالياً</div>
      </div>

      <div class="card">
        <div class="card-title">🌅 الشروق والغروب</div>
        <div class="metric-value" id="sunriseTime">--:-- ص</div>
        <div class="metric-desc">غروب الشمس: <span id="sunsetTime">--:-- م</span></div>
      </div>

      <div class="card">
        <div class="card-title">💧 الرطوبة</div>
        <div class="metric-value" id="humidityVal">--%</div>
        <div class="metric-desc">الطقس معتدل ومريح</div>
      </div>

      <div class="card">
        <div class="card-title">⏲️ الضغط الجوي</div>
        <div class="metric-value" id="pressureVal">-- hPa</div>
        <div class="metric-desc">ضغط الهواء طبيعي</div>
      </div>
    </div>
  </div>

  <script>
    let tempChartInstance = null;

    function getWeatherEmoji(code, isDay = 1) {
      if (code === 0) return { emoji: isDay ? "☀️" : "🌙", text: "مشمس" };
      if (code === 1 || code === 2) return { emoji: "🌤️", text: "غائم جزئياً" };
      if (code === 3) return { emoji: "☁️", text: "غائم" };
      if (code >= 45 && code <= 48) return { emoji: "🌫️", text: "ضباب" };
      if (code >= 51 && code <= 65) return { emoji: "🌧️", text: "أمطار" };
      if (code >= 71 && code <= 77) return { emoji: "❄️", text: "بارد/ثلج" };
      if (code >= 80 && code <= 82) return { emoji: "🌦️", text: "زخات مطر" };
      if (code >= 95) return { emoji: "🌩️", text: "عواصف رعدية" };
      return { emoji: "☀️", text: "صافٍ" };
    }

    async function fetchWeatherData() {
      const select = document.getElementById("citySelect");
      const [lat, lon] = select.value.split(",");
      const cityName = select.options[select.selectedIndex].text.split(" ")[0];
      
      document.getElementById("cityName").innerText = cityName;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,is_day,weather_code,surface_pressure&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,weather_code,precipitation_probability_max,precipitation_sum&timezone=auto`;
        
        const response = await fetch(url);
        const data = await response.json();

        // 1. الطقس الحالي
        const current = data.current;
        const currentTemp = Math.round(current.temperature_2m);
        document.getElementById("currentTemp").innerText = `${currentTemp}°`;
        document.getElementById("maxTemp").innerText = Math.round(data.daily.temperature_2m_max[0]);
        document.getElementById("minTemp").innerText = Math.round(data.daily.temperature_2m_min[0]);
        
        const weatherObj = getWeatherEmoji(current.weather_code, current.is_day);
        document.getElementById("conditionText").innerText = `${weatherObj.text} ${weatherObj.emoji}`;

        // 2. الساعات بتوقيت وتنسيق عربي
        const hourlyContainer = document.getElementById("hourlyContainer");
        hourlyContainer.innerHTML = "";
        for (let i = 0; i < 24; i += 2) {
          const dateObj = new Date(data.hourly.time[i]);
          const formattedTime = dateObj.toLocaleTimeString('ar-IQ', { hour: 'numeric', minute: '2-digit' });
          const temp = Math.round(data.hourly.temperature_2m[i]);
          const emoji = getWeatherEmoji(data.hourly.weather_code[i], data.hourly.is_day[i]).emoji;

          hourlyContainer.innerHTML += `
            <div class="hourly-item">
              <div class="time">${formattedTime}</div>
              <div class="icon">${emoji}</div>
              <div class="temp">${temp}°</div>
            </div>
          `;
        }

        // 3. الأمطار
        const rainProb = data.daily.precipitation_probability_max[0] || 0;
        const rainSum = data.daily.precipitation_sum[0] || 0;
        document.getElementById("rainProb").innerText = `${rainProb}%`;
        document.getElementById("rainDesc").innerText = rainProb > 30 ? `أمطار متوقعة بحدود ${rainSum} ملم` : "فرصة هطول أمطار ضئيلة جداً";

        // 4. ترتيب الأيام القادمة بترتيب زمني متسلسل
        const dailyHeaderGrid = document.getElementById("dailyHeaderGrid");
        dailyHeaderGrid.innerHTML = "";
        
        for (let i = 0; i < 7; i++) {
          const d = new Date(data.daily.time[i]);
          const dayName = i === 0 ? "اليوم" : d.toLocaleDateString('ar-IQ', { weekday: 'short' });
          const emoji = getWeatherEmoji(data.daily.weather_code[i]).emoji;
          const max = Math.round(data.daily.temperature_2m_max[i]);

          dailyHeaderGrid.innerHTML += `
            <div class="daily-col">
              <span class="day-name">${dayName}</span>
              <span class="day-icon">${emoji}</span>
              <span class="day-temp">${max}°</span>
            </div>
          `;
        }

        // 5. التفاصيل
        const sunrise = new Date(data.daily.sunrise[0]).toLocaleTimeString('ar-IQ', {hour: '2-digit', minute:'2-digit'});
        const sunset = new Date(data.daily.sunset[0]).toLocaleTimeString('ar-IQ', {hour: '2-digit', minute:'2-digit'});
        
        document.getElementById("sunriseTime").innerText = sunrise;
        document.getElementById("sunsetTime").innerText = sunset;
        document.getElementById("humidityVal").innerText = `${current.relative_humidity_2m}%`;
        document.getElementById("pressureVal").innerText = `${Math.round(current.surface_pressure)} hPa`;

        renderDailyChart(data.daily);

      } catch (err) {
        console.error("Error fetching weather", err);
      }
    }

    function renderDailyChart(dailyData) {
      const ctx = document.getElementById('tempChart').getContext('2d');
      const labels = dailyData.time.map((t, i) => i === 0 ? "اليوم" : new Date(t).toLocaleDateString('ar-IQ', { weekday: 'short' }));

      if (tempChartInstance) {
        tempChartInstance.destroy();
      }

      tempChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'العليا',
              data: dailyData.temperature_2m_max,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              tension: 0.4,
              borderWidth: 3,
              pointBackgroundColor: '#f59e0b'
            },
            {
              label: 'الدنيا',
              data: dailyData.temperature_2m_min,
              borderColor: '#38bdf8',
              backgroundColor: 'rgba(56, 189, 248, 0.1)',
              tension: 0.4,
              borderWidth: 3,
              pointBackgroundColor: '#38bdf8'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { display: false }
          }
        }
      });
    }

    window.onload = fetchWeatherData;
  </script>
</body>
</html>
