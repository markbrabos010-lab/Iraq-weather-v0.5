<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طقس الكاظمية الاحترافي</title>
    <!-- استدعاء خط Cairo المتناسق والمودرن -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Lucide للأيقونات النظيفة -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b111e 0%, #10192d 50%, #152238 100%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.09);
            --accent-yellow: #fbc02d;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        .weather-app {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1. الهيدر الرئيسي */
        .main-header {
            text-align: center;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .city-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .temp-main {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            margin: 8px 0;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .weather-status {
            font-size: 1.1rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 2. حاوية العرض المخصص (Cards Wrapper) */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .section-title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 3. شريط الساعات - يبدأ من الوقت الحالي */
        .hourly-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scroll-behavior: smooth;
        }

        .hourly-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .hourly-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .hour-card {
            min-width: 75px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .hour-card.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .hour-card:hover {
            background: var(--glass-hover);
            transform: translateY(-4px);
        }

        .hour-time {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .hour-temp {
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* 4. شبكة البطاقات التفصيلية */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .detail-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* لمسة قوس الشمس الشفافة */
        .sun-arc {
            width: 100%;
            height: 40px;
            border-top: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            margin-top: 10px;
            position: relative;
        }

        .sun-dot {
            width: 12px;
            height: 12px;
            background: var(--accent-yellow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-yellow);
            position: absolute;
            top: -6px;
            left: 30%;
        }

        /* الإلغاء الصارم والنهائي للقائمة السفلية */
        .bottom-nav, footer, .navigation-bar {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="weather-app">
        <!-- الهيدر والطقس الحالي -->
        <div class="main-header">
            <h1 class="city-name">الكاظمية</h1>
            <div class="temp-main">34°</div>
            <div class="weather-status">
                <i data-lucide="moon"></i>
                <span>صافٍ • العليا: 43° | الدنيا: 26°</span>
            </div>
        </div>

        <!-- توقعات الساعات (تبدأ تلقائياً من الساعة الحالية) -->
        <div class="card">
            <div class="section-title">
                <i data-lucide="clock" size="18"></i>
                <span>الطقس كل ساعة (بدءاً من الوقت الحالي)</span>
            </div>
            <div class="hourly-scroll" id="hourlyContainer">
                <!-- ينشأ الكود هنا تلقائياً بواسطة JS -->
            </div>
        </div>

        <!-- شبكة التفاصيل والمؤشرات المفصلة -->
        <div class="details-grid">
            <!-- الشروق والغروب -->
            <div class="card detail-item">
                <div class="detail-header">
                    <i data-lucide="sundial" size="18"></i>
                    <span>الشروق والغروب</span>
                </div>
                <div class="detail-value">05:04 <span style="font-size: 1rem;">ص</span></div>
                <div class="sun-arc"><div class="sun-dot"></div></div>
                <div class="detail-desc">غروب الشمس: 05:52 م</div>
            </div>

            <!-- الرطوبة -->
            <div class="card detail-item">
                <div class="detail-header">
                    <i data-lucide="droplets" size="18"></i>
                    <span>الرطوبة</span>
                </div>
                <div class="detail-value">34%</div>
                <div class="detail-desc" style="margin-top: auto;">الطقس معتدل ومريح حالياً</div>
            </div>

            <!-- فرص المطر -->
            <div class="card detail-item">
                <div class="detail-header">
                    <i data-lucide="cloud-rain" size="18"></i>
                    <span>توقع المطر القادم</span>
                </div>
                <div class="detail-value">0%</div>
                <div class="detail-desc" style="margin-top: auto;">فرصة هطول أمطار ضئيلة جداً</div>
            </div>

            <!-- الضغط الجوي -->
            <div class="card detail-item">
                <div class="detail-header">
                    <i data-lucide="gauge" size="18"></i>
                    <span>الضغط الجوي</span>
                </div>
                <div class="detail-value">1001 <span style="font-size: 0.9rem;">hPa</span></div>
                <div class="detail-desc" style="margin-top: auto;">ضغط الهواء طبيعي ومستقر</div>
            </div>
        </div>
    </div>

    <script>
        // دالة إنشاء توقعات الساعات بدءاً من الساعة الحالية للجهاز
        function generateHourlyData() {
            const container = document.getElementById('hourlyContainer');
            container.innerHTML = '';

            const now = new Date();
            const currentHour = now.getHours(); // جلب الساعة الحالية (0-23)

            // محاكاة درجات الحرارة والأيقونات للـ 24 ساعة القادمة
            const baseTemps = [27, 26, 27, 30, 33, 35, 37, 39, 42, 43, 43, 39, 37, 35, 34, 32, 31, 30, 29, 28, 28, 27, 26, 26];

            for (let i = 0; i < 15; i++) {
                let hour = (currentHour + i) % 24;
                let isNow = i === 0;
                
                // تنسيق ص/م
                let ampm = hour >= 12 ? 'م' : 'ص';
                let displayHour = hour % 12;
                displayHour = displayHour ? displayHour : 12; 
                let timeText = isNow ? 'الآن' : `${displayHour} ${ampm}`;

                // اختيار الأيقونة حسب الليل والنهار
                let iconName = (hour >= 6 && hour < 18) ? 'sun' : 'moon';
                if (hour === 5) iconName = 'sunrise';
                if (hour === 18) iconName = 'sunset';

                let temp = baseTemps[hour] || 32;

                // بناء عنصر الساعة
                const hourCard = document.createElement('div');
                hourCard.className = `hour-card ${isNow ? 'active' : ''}`;
                hourCard.innerHTML = `
                    <span class="hour-time">${timeText}</span>
                    <i data-lucide="${iconName}" size="22" style="color: ${iconName.includes('sun') ? '#fbc02d' : '#e2e8f0'}"></i>
                    <span class="hour-temp">${temp}°</span>
                `;

                container.appendChild(hourCard);
            }

            // إعادة تهيئة الأيقونات
            lucide.createIcons();
        }

        // تشغيل الدالة عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', generateHourlyData);
    </script>
</body>
</html>
